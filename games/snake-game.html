<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · 霓虹贪吃 | Snake Neon</title>
<!-- ===== 导航站约定标签：新增页面时照抄这一段即可被 index.html 自动收录 ===== -->
<meta name="description" content="经典贪吃蛇：霓虹赛道、自动加速、撞墙撞自己即结束，键盘方向键 / WASD 与触屏滑动都能玩，最高分本地保存。">
<meta name="wb-category" content="游戏">
<meta name="wb-icon" content="🐍">
<meta name="wb-tags" content="贪吃蛇,休闲,键盘,触屏,经典">
<meta name="wb-order" content="20">
<style>
  :root{
    --bg: #070a12;
    --panel: rgba(255,255,255,.045);
    --panel-brd: rgba(255,255,255,.10);
    --txt: #e8eefc;
    --txt-dim: #8494b3;
    --accent: #43e0ff;
    --accent2: #a855f7;
    --good: #4ade80;
    --bad: #ff5d73;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;
    padding:18px 14px 28px;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(67,224,255,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,.10), transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
  }
  .head{text-align:center;margin-top:4px}
  .head h1{
    margin:0;font-size:22px;letter-spacing:1px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .head p{margin:5px 0 0;font-size:12px;color:var(--txt-dim)}

  .wrap{
    width:min(94vw,440px);
    background:var(--panel);
    border:1px solid var(--panel-brd);
    border-radius:18px;
    padding:14px;
    backdrop-filter:blur(8px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .stats{display:flex;gap:10px;margin-bottom:12px}
  .stat{
    flex:1;text-align:center;padding:9px 6px;border-radius:12px;
    background:rgba(255,255,255,.03);border:1px solid var(--panel-brd);
  }
  .stat .k{font-size:10.5px;color:var(--txt-dim);letter-spacing:.5px}
  .stat .v{font-size:21px;font-weight:700;margin-top:2px;color:var(--accent)}
  .stat.best .v{color:var(--accent2)}

  .board{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/100% calc(100%/22),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/calc(100%/22) 100%,
      radial-gradient(circle at 50% 40%, rgba(67,224,255,.06), transparent 70%),
      #060912;
    border:1px solid var(--panel-brd);
    touch-action:none;
  }
  canvas{display:block;width:100%;height:100%}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(6,9,18,.78);backdrop-filter:blur(3px);text-align:center;padding:20px;
    transition:opacity .18s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay h2{margin:0;font-size:22px;letter-spacing:1px}
  .overlay .sub{font-size:12.5px;color:var(--txt-dim);line-height:1.6;max-width:300px}
  .overlay .big{font-size:30px;font-weight:800;color:var(--accent);margin:-4px 0}

  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  button{
    font:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:12px;cursor:pointer;
    color:#04121a;border:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 6px 18px rgba(67,224,255,.25);
  }
  button:hover{transform:translateY(-1px)}
  button.ghost{
    background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--panel-brd);
    box-shadow:none;
  }

  .toolbar{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .toolbar button{padding:9px 16px;font-size:13px}

  /* 移动端方向键 */
  .dpad{
    display:none;width:min(94vw,440px);margin-top:4px;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,58px);gap:8px;
  }
  .dpad button{
    border-radius:14px;font-size:22px;padding:0;color:var(--txt);
    background:var(--panel);border:1px solid var(--panel-brd);box-shadow:none;
    display:grid;place-items:center;
  }
  .dpad button:active{background:rgba(67,224,255,.18)}
  .dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .down{grid-area:3/2}.dpad .right{grid-area:2/3}
  .dpad .mid{grid-area:2/2;background:transparent;border:0;font-size:11px;color:var(--txt-dim)}

  .hint{font-size:11.5px;color:var(--txt-dim);text-align:center;line-height:1.6}
  kbd{
    font-family:inherit;font-size:11px;padding:1px 6px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--panel-brd);color:var(--txt);
  }

  @media (hover:none) and (pointer:coarse){
    .dpad{display:grid}
    .hint .kbdline{display:none}
  }
</style>
</head>
<body>
  <div class="head">
    <h1>🐍 贪吃蛇 · 霓虹贪吃</h1>
    <p>吃豆变长，撞墙或撞自己就结束 —— 吃得越多跑得越快</p>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
      <div class="stat"><div class="k">长度</div><div class="v" id="len">1</div></div>
      <div class="stat best"><div class="k">最高分</div><div class="v" id="best">0</div></div>
    </div>

    <div class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">准备好了吗？</h2>
        <div class="sub" id="ovSub">用 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W A S D</kbd> 控制方向；手机可滑动或用下方按钮。</div>
        <div class="big" id="ovScore" style="display:none">0</div>
        <div class="btns">
          <button id="startBtn">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="ghost" id="pauseBtn" disabled>暂停</button>
      <button class="ghost" id="restartBtn">重新开始</button>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="mid">滑动<br>也行</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>

  <div class="hint">
    <span class="kbdline">键盘：方向键 / WASD 转向，<kbd>空格</kbd> 暂停，<kbd>Enter</kbd> 开始/重开。</span><br>
    手机：在棋盘上滑动，或用下方方向键。最高分保存在本机。
  </div>

<script>
(function(){
  'use strict';
  var GRID = 22;                       // 棋盘格数
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var lenEl = document.getElementById('len');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var ovScore = document.getElementById('ovScore');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');

  var BEST_KEY = 'snake_neon_best';
  var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
  bestEl.textContent = best;

  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  var cell = 0;                        // 像素/格
  function resize(){
    var rect = board.getBoundingClientRect();
    var size = Math.floor(rect.width);
    cv.width = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
    cv.style.width = size + 'px';
    cv.style.height = size + 'px';
    cell = cv.width / GRID;
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- 游戏状态 ----
  var snake, dir, nextDir, food, score, alive, running, paused, acc, stepMs, lastT, raf;

  function reset(){
    var c = Math.floor(GRID/2);
    snake = [{x:c, y:c}];
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    score = 0;
    stepMs = 140;                      // 初始速度（毫秒/步）
    acc = 0;
    placeFood();
    updateHud();
  }

  function placeFood(){
    var occupied = {};
    snake.forEach(function(s){ occupied[s.x+','+s.y] = 1; });
    var free = [];
    for (var y=0;y<GRID;y++) for (var x=0;x<GRID;x++){
      if (!occupied[x+','+y]) free.push({x:x,y:y});
    }
    food = free.length ? free[(Math.random()*free.length)|0] : null;
  }

  function updateHud(){
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
    if (score > best){ best = score; bestEl.textContent = best; localStorage.setItem(BEST_KEY, String(best)); }
  }

  function step(){
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID){ return gameOver(); }
    // 撞自己
    for (var i=0;i<snake.length;i++){
      if (snake[i].x === head.x && snake[i].y === head.y){ return gameOver(); }
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y){
      score += 10;
      // 加速：每吃 5 颗豆减一档，最快 70ms
      stepMs = Math.max(70, 140 - Math.floor(score/50) * 8);
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
  }

  // ---- 绘制 ----
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw(){
    var s = cell;
    ctx.clearRect(0,0,cv.width,cv.height);

    // 食物（霓虹脉冲）
    if (food){
      var t = (Date.now() % 1000) / 1000;
      var pulse = 0.5 + 0.5*Math.sin(t*Math.PI*2);
      var fx = food.x*s + s/2, fy = food.y*s + s/2;
      ctx.save();
      ctx.shadowColor = '#ff5d73';
      ctx.shadowBlur = 14 + 8*pulse;
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath();
      ctx.arc(fx, fy, s*0.30, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 蛇身（头部亮、尾部渐隐的霓虹渐变）
    for (var i=snake.length-1;i>=0;i--){
      var p = snake[i];
      var ratio = snake.length>1 ? i/(snake.length-1) : 0;   // 0=头 1=尾
      var hue = 190 - ratio*70;                              // cyan→purple
      var light = 62 - ratio*22;
      ctx.fillStyle = 'hsl('+hue+',85%,'+light+'%)';
      if (i===0){ ctx.shadowColor = '#43e0ff'; ctx.shadowBlur = 16; }
      else { ctx.shadowBlur = 0; }
      var pad = s*0.10;
      roundRect(p.x*s+pad, p.y*s+pad, s-2*pad, s-2*pad, s*0.28);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 蛇眼（朝向）
    var hd = snake[0];
    if (hd){
      var cx = hd.x*s + s/2, cy = hd.y*s + s/2;
      var r = s*0.10;
      var ox = dir.x * s*0.18, oy = dir.y * s*0.18;
      ctx.fillStyle = '#04121a';
      ctx.beginPath(); ctx.arc(cx-ox - dir.y*r, cy-oy - dir.x*r, r*0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx-ox + dir.y*r, cy-oy + dir.x*r, r*0.9, 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- 循环 ----
  function loop(t){
    if (!running || paused){ return; }
    if (!lastT) lastT = t;
    var dt = t - lastT; lastT = t;
    acc += dt;
    while (acc >= stepMs){
      acc -= stepMs;
      step();
      if (!alive){ break; }
    }
    draw();
    if (alive){ raf = requestAnimationFrame(loop); }
  }

  function start(){
    reset();
    alive = true; running = true; paused = false;
    overlay.classList.add('hidden');
    pauseBtn.disabled = false; pauseBtn.textContent = '暂停';
    lastT = 0; acc = 0;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function gameOver(){
    alive = false; running = false;
    cancelAnimationFrame(raf);
    ovScore.style.display = 'block';
    ovScore.textContent = score;
    ovTitle.textContent = score >= best && score > 0 ? '新纪录！🎉' : '游戏结束';
    ovSub.textContent = '本局得分 ' + score + ' · 长度 ' + snake.length + (score>=best&&score>0 ? ' · 刷新了最高分' : ' · 最高分 ' + best);
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    pauseBtn.disabled = true;
  }

  function togglePause(){
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    if (paused){
      cancelAnimationFrame(raf);
      ovTitle.textContent = '已暂停';
      ovSub.textContent = '点「继续」或按空格回到游戏。';
      ovScore.style.display = 'none';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastT = 0; acc = 0;
      raf = requestAnimationFrame(loop);
    }
  }

  // ---- 方向控制 ----
  function setDir(nx, ny){
    // 不能直接掉头
    if (snake.length>1 && nx === -dir.x && ny === -dir.y) return;
    nextDir = {x:nx, y:ny};
  }
  var KEYMAP = {
    'ArrowUp':[0,-1],'ArrowDown':[0,1],'ArrowLeft':[-1,0],'ArrowRight':[1,0],
    'w':[0,-1],'s':[0,1],'a':[-1,0],'d':[1,0],
    'W':[0,-1],'S':[0,1],'A':[-1,0],'D':[1,0]
  };
  window.addEventListener('keydown', function(e){
    if (e.key === ' '){ e.preventDefault(); if (running) togglePause(); return; }
    if (e.key === 'Enter'){
      if (!running || !alive) start();
      else if (paused) togglePause();
      return;
    }
    var m = KEYMAP[e.key];
    if (m){ e.preventDefault(); setDir(m[0], m[1]); }
  });

  // 触屏滑动
  var tsx=0, tsy=0, tracking=false;
  board.addEventListener('touchstart', function(e){
    var t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; tracking=true;
  }, {passive:true});
  board.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  board.addEventListener('touchend', function(e){
    if (!tracking) return; tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)<18 && Math.abs(dy)<18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0);
    else setDir(0, dy>0?1:-1);
  }, {passive:true});

  // 方向键按钮
  document.getElementById('dpad').addEventListener('click', function(e){
    var b = e.target.closest('[data-dir]'); if (!b) return;
    var d = b.getAttribute('data-dir');
    if (d==='up') setDir(0,-1);
    else if (d==='down') setDir(0,1);
    else if (d==='left') setDir(-1,0);
    else if (d==='right') setDir(1,0);
  });

  startBtn.addEventListener('click', function(){
    if (paused){ togglePause(); } else { start(); }
  });
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', start);

  // 初始
  resize();
  reset();
  draw();
})();
</script>
</body>
</html>
