<style>
  :root{
    --bg:#070a12; --panel:rgba(255,255,255,.045); --brd:rgba(255,255,255,.10);
    --txt:#e8eefc; --dim:#8494b3; --a1:#43e0ff; --a2:#a855f7;

  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;

      radial-gradient(1200px 600px at 50% -10%, rgba(67,224,255,.10), transparent 60%),

<body>
  <h1>数字合并 · 极速 2048</h1>
  <p class="hint">滑动或按方向键合并相同数字 · 每步都有时间压力，别拖</p>

  <div class="frame">
    <div class="hud">
      <div class="stat"><b id="ui-score">0</b><span>得分</span></div>
      <div class="stat"><b id="ui-best">0</b><span>最高分</span></div>
      <div class="stat" id="ui-time-box"><b id="ui-time">10</b><span>剩余秒数</span></div>
    </div>
    <canvas id="cv" width="420" height="420"></canvas>
    <div class="bar">
      <button id="btn-restart">重新开始</button>
    </div>
  </div>

  <div class="dpad">
    <button class="sp"></button><button class="up" data-dir="up">▲</button><button class="sp"></button>
    <button data-dir="left">◀</button><button class="mid" id="btn-restart2">↻</button><button data-dir="right">▶</button>
    <button class="sp"></button><button data-dir="down">▼</button><button class="sp"></button>
  </div>

<script>
/* ==========================================================================
   数字合并 · 极速 2048  —  单文件零依赖
   玩法：4×4 网格，滑动让同值方块合并翻倍。合出 2048 即通关。
   特色 twist：每走一步都会重置倒计时，但步与步之间存在时间压力——
   空闲超过 TIME_LIMIT 秒未操作即判负，逼你在「想清楚」和「别磨蹭」之间取舍。
   规则：不引用同目录外部 .js/.css；图片音频用 CDN 绝对地址或 data: URI。
   ========================================================================== */
'use strict';

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var uiScore = document.getElementById('ui-score');
var uiBest  = document.getElementById('ui-best');
var uiTime  = document.getElementById('ui-time');
var uiTimeBox = document.getElementById('ui-time-box');

var BEST_KEY = 'merge-2048-best';

var state = {
  running: false,
  over: false,
  won: false,
  score: 0,
  best: 0,
  frame: 0,
};

/* ------------------------------ 持久化 ---------------------------------- */
function loadBest() {
  try { state.best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; }
  catch (e) { state.best = 0; }
  uiBest.textContent = state.best;
}
function saveBest() {
  if (state.score > state.best) {
    state.best = state.score;
    uiBest.textContent = state.best;
    try { localStorage.setItem(BEST_KEY, String(state.best)); } catch (e) {}
  }
}

/* ------------------------------ 音效（Web Audio 合成，免音频文件） ------- */
var ac = null;
function beep(freq, dur, type) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.stop(ac.currentTime + dur);
  } catch (e) { /* 无音频环境时静默 */ }
}

/* ------------------------------ 输入：键盘 + 触屏 ------------------------ */
var input = { up:false, down:false, left:false, right:false, action:false };

/* 本作是「一次性动作」型游戏：一次按键 = 一次移动，用事件直接触发，
   而不是靠 update() 里读持续的 input 状态（那样会每帧连移）。
   另外加一个 pendingDir，供触屏滑动与虚拟键复用同一条执行路径。 */
var pendingDir = null;   // 'up' | 'down' | 'left' | 'right' | null

function pushDir(d) {
  if (state.over || state.won || !state.running) return;
  pendingDir = d;
}

document.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') { pushDir('up');    e.preventDefault(); }
  if (k === 'ArrowDown'  || k === 's' || k === 'S') { pushDir('down');  e.preventDefault(); }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { pushDir('left');  e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { pushDir('right'); e.preventDefault(); }
  if (k === ' ') { input.action = true; if (state.over || state.won) restart(); e.preventDefault(); }
});
document.addEventListener('keyup', function (e) {
  if (e.key === ' ') input.action = false;
});

/* 触屏：在画布上滑动 = 一个方向；点按无效（避免误触直接走一步） */
(function bindTouch() {
  var sx = 0, sy = 0, fired = false;
  cv.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; fired = false;
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (!fired && (Math.abs(dx) > 24 || Math.abs(dy) > 24)) {
      fired = true;
      if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 'right' : 'left');
      else pushDir(dy > 0 ? 'down' : 'up');
    }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', function (e) {
    e.preventDefault();
  }, { passive: false });
})();

/* 虚拟方向键 */
(function bindDpad() {
  var btns = document.querySelectorAll('.dpad button[data-dir]');
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      var fn = function (e) { pushDir(b.getAttribute('data-dir')); e.preventDefault(); };
      b.addEventListener('click', fn);
      b.addEventListener('touchstart', fn, { passive: false });
    })(btns[i]);
  }
})();

document.getElementById('btn-restart').addEventListener('click', restart);
document.getElementById('btn-restart2').addEventListener('click', restart);

/* ------------------------ 游戏逻辑 --------------------------------------- */
var N = 4;                 // 4×4
var GAP = 12;              // 方块间距
var PAD = 14;              // 网格内边距
var CELL = (W - PAD * 2 - GAP * (N - 1)) / N;   // 每格边长

var TIME_LIMIT = 10.0;     // 空闲多少秒判负（每走一步重置）
var board = [];            // N×N，值为 0（空）或 2 的幂
var timeLeft = TIME_LIMIT;

/* 每种数值的配色——由低到高渐变，2048 之后统一用金红强调 */
var TILE_STYLE = {
  2:    { bg: '#1d2740', fg: '#cfe0ff' },
  4:    { bg: '#243457', fg: '#dbe8ff' },
  8:    { bg: '#1d4f7a', fg: '#eaf6ff' },
  16:   { bg: '#1b6a8c', fg: '#eafaff' },
  32:   { bg: '#17889a', fg: '#eafffe' },
  64:   { bg: '#2f8f6f', fg: '#eafff3' },
  128:  { bg: '#7a9a2e', fg: '#f7ffe6' },
  256:  { bg: '#b8922a', fg: '#fff8e6' },
  512:  { bg: '#d2732a', fg: '#fff2e6' },
  1024: { bg: '#c94f52', fg: '#ffecec' },
  2048: { bg: '#a855f7', fg: '#f9f1ff' }
};
function tileStyle(v) {
  if (TILE_STYLE[v]) return TILE_STYLE[v];
  return { bg: '#e0b0ff', fg: '#1a0b2e' };   // 4096+ 用亮紫配深字
}

function emptyBoard() {
  var b = [];
  for (var y = 0; y < N; y++) {
    b.push([]);
    for (var x = 0; x < N; x++) b[y].push(0);
  }
  return b;
}

function emptyCells() {
  var out = [];
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) if (board[y][x] === 0) out.push({ x: x, y: y });
  return out;
}

/* 放一个新方块：90% 出 2，10% 出 4（经典比例） */
function addRandomTile() {
  var cells = emptyCells();
  if (!cells.length) return;
  var c = cells[(Math.random() * cells.length) | 0];
  board[c.y][c.x] = Math.random() < 0.9 ? 2 : 4;
}

function reset() {
  state.score = 0;
  state.frame = 0;
  state.over = false;
  state.won = false;
  state.running = true;
  board = emptyBoard();
  timeLeft = TIME_LIMIT;
  pendingDir = null;
  addRandomTile();
  addRandomTile();
  uiScore.textContent = '0';
  uiTime.textContent = TIME_LIMIT.toFixed(0);
  uiTimeBox.classList.remove('warn');
}

function restart() { reset(); }

/* 把一行向左压缩并合并；返回 {line, gained, moved} */
function collapseLine(line) {
  var vals = line.filter(function (v) { return v !== 0; });
  var out = [], gained = 0, i;
  for (i = 0; i < vals.length; i++) {
    if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
      var merged = vals[i] * 2;
      out.push(merged);
      gained += merged;
      i++;                       // 跳过被吃掉的那个
    } else {
      out.push(vals[i]);
    }
  }
  while (out.length < N) out.push(0);
  var moved = false;
  for (i = 0; i < N; i++) if (out[i] !== line[i]) { moved = true; break; }
  return { line: out, gained: gained, moved: moved };
}

/* 依据方向把整盘「转」成统一向左处理，处理完再转回来。
   这样只需要写一份合并逻辑，四方向共用，避免四份相似代码各带各的 bug。 */
function rotateCW(b) {
  var out = emptyBoard();
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) out[x][N - 1 - y] = b[y][x];
  return out;
}
function rotateTimes(b, times) {
  var r = b;
  for (var i = 0; i < ((times % 4) + 4) % 4; i++) r = rotateCW(r);
  return r;
}

/* 返回这一方向总共旋转了几次 CW，才能把该方向变成「向左」 */
function pivotFor(dir) {
  if (dir === 'left')  return 0;
  if (dir === 'up')    return 3;   // 向上 → 转 3 次变向左
  if (dir === 'right') return 2;
  return 1;                        // down
}

function move(dir) {
  if (state.over || state.won || !state.running) return false;
  if (!dir) return false;

  var before = board.map(function (row) { return row.slice(); });   // 用于落子动画对比
  var pivot = pivotFor(dir);
  var work = rotateTimes(board, pivot);

  var gained = 0, moved = false;
  for (var y = 0; y < N; y++) {
    var res = collapseLine(work[y]);
    work[y] = res.line;
    gained += res.gained;
    if (res.moved) moved = true;
  }

  board = rotateTimes(work, 4 - pivot);

  if (!moved) {
    // 没动就不该有惩罚，只是白按了一下
    return false;
  }

  if (gained > 0) {
    state.score += gained;
    uiScore.textContent = state.score;
    beep(gained >= 128 ? 880 : 620, 0.07, 'triangle');
  } else {
    beep(320, 0.04, 'sine');
  }

  addRandomTile();
  markPops(before);
  timeLeft = TIME_LIMIT;           // 每成功走一步，时间重置
  saveBest();
  checkEnd();
  return true;
}

function maxTile() {
  var m = 0;
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) if (board[y][x] > m) m = board[y][x];
  return m;
}

/* 还有没有可走的步：有空格，或相邻有同值 */
function canMove() {
  if (emptyCells().length) return true;
  for (var y = 0; y < N; y++) {
    for (var x = 0; x < N; x++) {
      var v = board[y][x];
      if (x + 1 < N && board[y][x + 1] === v) return true;
      if (y + 1 < N && board[y + 1][x] === v) return true;
    }
  }
  return false;
}

function checkEnd() {
  if (maxTile() >= 2048 && !state.won) {
    state.won = true;
    state.running = false;
    saveBest();
    endSound(true);
    return;
  }
  if (!canMove()) {
    state.over = true;
    state.running = false;
    saveBest();
    endSound(false);
  }
}

function endSound(good) {
  if (good) { beep(660, 0.12, 'triangle'); setTimeout(function () { beep(990, 0.18, 'triangle'); }, 120); }
  else      { beep(220, 0.20, 'sawtooth'); setTimeout(function () { beep(150, 0.26, 'sawtooth'); }, 150); }
}

/* ------------------------------ update ---------------------------------- */
var FPS = 60;

function update() {
  if (!state.running || state.over || state.won) { pendingDir = null; return; }
  state.frame++;

  // 消费一次方向指令（事件只负责投递，真正的执行放在固定步长里，手感稳定）
  if (pendingDir) {
    var d = pendingDir;
    pendingDir = null;
    move(d);
  }

  // 倒计时
  timeLeft -= 1 / FPS;
  if (timeLeft <= 0) {
    timeLeft = 0;
    state.over = true;
    state.running = false;
    saveBest();
    endSound(false);
  }

  var shown = Math.max(0, Math.ceil(timeLeft));
  if (uiTime.textContent !== String(shown)) uiTime.textContent = shown;
  if (timeLeft <= 3) uiTimeBox.classList.add('warn');
  else uiTimeBox.classList.remove('warn');
}

/* ------------------------------ render ---------------------------------- */
/* 轻微的落子缩放：记下每个格子上次的值，值变了就播放一次放大动画，
   用来给「刚合并出来」的方块一点反馈。 */
var popAnim = [];      // [y][x] = 剩余帧数
function markPops(before) {
  popAnim = [];
  for (var y = 0; y < N; y++) {
    popAnim.push([]);
    for (var x = 0; x < N; x++) {
      var now = board[y][x];
      var was = before && before[y] && before[y][x] !== undefined ? before[y][x] : 0;
      popAnim[y].push(now > was ? 10 : 0);
    }
  }
}

function drawCell(x, y, v, scale) {
  var px = PAD + x * (CELL + GAP);
  var py = PAD + y * (CELL + GAP);
  var st = tileStyle(v);
  var s = CELL * scale;
  var off = (CELL - s) / 2;

  ctx.fillStyle = st.bg;
  roundRect(px + off, py + off, s, s, Math.max(4, s * 0.11));
  ctx.fill();

  if (v > 0) {
    var digits = String(v).length;
    var fs = CELL * (digits <= 2 ? 0.44 : digits === 3 ? 0.34 : digits === 4 ? 0.27 : 0.22);
    ctx.fillStyle = st.fg;
    ctx.font = '700 ' + fs.toFixed(1) + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(v), px + CELL / 2, py + CELL / 2 + 1);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function render() {
  ctx.fillStyle = '#04060c';
  ctx.fillRect(0, 0, W, H);

  // 网格底板
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  roundRect(6, 6, W - 12, H - 12, 14);
  ctx.fill();

  // 空格底
  for (var y = 0; y < N; y++) {
    for (var x = 0; x < N; x++) {
      if (board[y][x] !== 0) continue;
      var px = PAD + x * (CELL + GAP), py = PAD + y * (CELL + GAP);
      ctx.fillStyle = 'rgba(255,255,255,.028)';
      roundRect(px, py, CELL, CELL, CELL * 0.11);
      ctx.fill();
    }
  }

  // 方块（带动画）
  for (y = 0; y < N; y++) {
    for (x = 0; x < N; x++) {
      var v = board[y][x];
      if (v === 0) continue;
      var pf = popAnim[y] ? popAnim[y][x] : 0;
      var scale = 1;
      if (pf > 0) {
        var t = 1 - pf / 10;                  // 0 → 1
        scale = 1 + 0.16 * Math.sin(Math.PI * t);
      }
      drawCell(x, y, v, scale);
      if (pf > 0) popAnim[y][x] = pf - 1;
    }
  }

  // 时间条：贴网格底部，随剩余时间收缩，少于 3 秒变红
  var frac = Math.max(0, Math.min(1, timeLeft / TIME_LIMIT));
  var barH = 5, barY = H - 14, barX = 14, barW = W - 28;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  roundRect(barX, barY, barW, barH, 3); ctx.fill();
  ctx.fillStyle = timeLeft <= 3 ? '#ff5d73' : '#43e0ff';
  roundRect(barX, barY, Math.max(2, barW * frac), barH, 3); ctx.fill();

  // 结算遮罩
  if (state.over || state.won) {
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fillRect(0, 0, W, H);
    var win = state.won;
    ctx.fillStyle = win ? '#4ade80' : '#ff5d73';
    ctx.font = 'bold 30px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(win ? '通关！2048 达成' : (timeLeft <= 0 ? '超时了' : '无路可走'), W / 2, H / 2 - 38);
    ctx.fillStyle = '#e8eefc';
    ctx.font = '16px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('得分 ' + state.score, W / 2, H / 2 + 4);
    ctx.fillStyle = '#8494b3';
    ctx.font = '13.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('按空格或点「重新开始」再来一局', W / 2, H / 2 + 40);
  }
}

/* ------------------------------ 主循环 ---------------------------------- */
var acc = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = now - last; last = now;
  if (dt > 200) dt = 200;          // 切标签回来别一次补太多帧
  acc += dt;
  var step = 1000 / FPS, guard = 0;
  while (acc >= step && guard++ < 5) { update(); acc -= step; }
  render();
}

/* ------------------------------ 启动 ------------------------------------ */
loadBest();
reset();
requestAnimationFrame(function (t) { last = t; loop(t); });
</script>
</body>
</html>
